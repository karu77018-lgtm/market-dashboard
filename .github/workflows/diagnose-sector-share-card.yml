name: Diagnose sector share card

on:
  push:
    branches:
      - fix/sector-share-card-major-data
    paths:
      - ".github/workflows/diagnose-sector-share-card.yml"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract recovered source
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf bootstrap/recovery-assets.tar.xz
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          parts = sorted(Path('sources/build_dashboard_4').glob('build_dashboard_4.py.lzma.b85.part*'))
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          raw = lzma.decompress(base64.b85decode(encoded.encode('ascii')))
          expected = 'ee306726ee4b629f92c5d2d6687c06869702030f60922c93f44ead713bc8bb80'
          digest = hashlib.sha256(raw).hexdigest()
          if digest != expected:
              raise SystemExit(f'SHA mismatch {digest}')
          Path('/tmp/build_dashboard_4.py').write_bytes(raw)
          PY

      - name: Produce compact diagnostic report
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          Path('diagnostics').mkdir(exist_ok=True)

          src = Path('/tmp/build_dashboard_4.py').read_text(encoding='utf-8', errors='replace')
          lines = src.splitlines()
          pats = [
              r'SNS', r'共有', r'share', r'rotation', r'sector', r'major',
              r'順位フロー', r'大分類', r'小分類', r'sub.?theme', r'money.?flow',
              r'rank.?flow'
          ]
          rx = re.compile('|'.join(pats), re.I)
          hits = [i for i,line in enumerate(lines) if rx.search(line)]
          selected = set()
          for i in hits:
              selected.update(range(max(0,i-8), min(len(lines), i+9)))
          out = []
          last = None
          for i in sorted(selected):
              if last is not None and i > last + 1:
                  out.append('...\n')
              line = lines[i]
              if len(line) > 1200:
                  line = line[:1200] + ' ...<TRUNCATED>'
              out.append(f'{i+1:06d}: {line}\n')
              last = i
          Path('diagnostics/source_hits.txt').write_text(''.join(out), encoding='utf-8')

          html = Path('source-mc57.html').read_text(encoding='utf-8', errors='replace')
          needles = ['SNS共有用カード','セクター・ローテーション','大分類','順位フロー','Rank Flow']
          hout=[]
          seen=set()
          for needle in needles:
              for m in re.finditer(re.escape(needle), html, flags=re.I):
                  key=m.start()//1000
                  if key in seen: continue
                  seen.add(key)
                  s=max(0,m.start()-2500); e=min(len(html),m.end()+5000)
                  hout.append(f'\n--- {needle} @ {m.start()} ---\n')
                  hout.append(html[s:e])
                  hout.append('\n')
                  if len(seen)>=12: break
              if len(seen)>=12: break
          Path('diagnostics/html_hits.txt').write_text(''.join(hout), encoding='utf-8')
          PY

      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/source_hits.txt diagnostics/html_hits.txt
          git commit -m "Diagnostic: compact sector share-card snippets" || exit 0
          git push origin HEAD:fix/sector-share-card-major-data
