name: Research expectation load backtest

on:
  workflow_dispatch:
  push:
    branches:
      - research/universal-expectation-gap-20260930
    paths:
      - scripts/backtest_expectation_load.py
      - .github/workflows/research-expectation-load-backtest.yml

permissions:
  contents: write

concurrency:
  group: research-expectation-load-backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Research branch guard
        run: test "${{ github.ref_name }}" = "research/universal-expectation-gap-20260930"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic backtest
        run: python scripts/backtest_expectation_load.py --root . --start 2022-01-01 --step 21
      - name: Commit backtest outputs race-safely
        run: |
          cp research/expectation_gap/expectation-load-backtest-v1.json /tmp/expectation-load-backtest-v1.json
          cp maintenance/expectation-load-backtest-v1-20260930.md /tmp/expectation-load-backtest-v1-20260930.md
          git fetch origin research/universal-expectation-gap-20260930
          git reset --hard origin/research/universal-expectation-gap-20260930
          mkdir -p research/expectation_gap maintenance
          cp /tmp/expectation-load-backtest-v1.json research/expectation_gap/expectation-load-backtest-v1.json
          cp /tmp/expectation-load-backtest-v1-20260930.md maintenance/expectation-load-backtest-v1-20260930.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/expectation_gap/expectation-load-backtest-v1.json maintenance/expectation-load-backtest-v1-20260930.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: backtest expectation load baseline"
          git push origin HEAD:research/universal-expectation-gap-20260930
