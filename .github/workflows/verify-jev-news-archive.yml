name: Verify saved Jev news archive
on:
  push:
    branches: [research/jev-news-backfill-20260929]
    paths: ["tools/jev_news_archive_audit.py", ".github/workflows/verify-jev-news-archive.yml"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'karu77018-lgtm/market-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned verification dependencies
        run: python -m pip install requests==2.32.5 cryptography==46.0.4 pytest==9.0.2
      - name: Verify safety tests
        run: python -m pytest research/news_backfill/test_archive.py -q
      - name: Retrieve and authenticate the saved encrypted archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,zipfile
          try:
              if not os.environ.get('ARCHIVE_PASSPHRASE'):raise RuntimeError('missing configuration')
              private=pathlib.Path('.private-news');private.mkdir(exist_ok=True)
              output=pathlib.Path('news-verification');output.mkdir(exist_ok=True)
              repo=os.environ['GITHUB_REPOSITORY']
              path=private/'download.zip'
              with path.open('wb') as handle:
                  subprocess.run(['gh','api',f'repos/{repo}/actions/artifacts/11038219065/zip'],stdout=handle,stderr=subprocess.PIPE,check=True)
              expected='f99f6d3c14f1e6b62497115f166dec3d9768a52a1fdf393be89a68e2a0ce2196'
              if hashlib.sha256(path.read_bytes()).hexdigest()!=expected:raise RuntimeError('zip hash mismatch')
              with zipfile.ZipFile(path) as z:
                  if set(z.namelist())!={'news.sqlite.gz.aesgcm','report.json'}:raise RuntimeError('unexpected archive member')
                  report=json.loads(z.read('report.json'))
                  sealed=z.read('news.sqlite.gz.aesgcm')
              if hashlib.sha256(sealed).hexdigest()!=report['encrypted_sha256']:raise RuntimeError('content hash mismatch')
              archive=private/'download.aesgcm';archive.write_bytes(sealed)
              subprocess.run(['python','research/news_backfill/archive.py','restore','--archive',str(archive)],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              raw=subprocess.run(['gh','api',f'repos/{repo}/contents/chart-data/index.json?ref=d84a70dd46df011df502217f2737ed08a1e90fa2'],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              metadata=json.loads(raw.stdout)
              (private/'universe-index.json').write_bytes(base64.b64decode(metadata['content'],validate=False))
              report['storage']='saved_encrypted_artifact_retrieved_and_authenticated'
              report['artifact_id']=11038219065
              report['source_run_id']=36577070516
              report['download_zip_sha256']=expected
              report['download_hash_matches']=True
              report['restoration_authenticated']=True
              (output/'acquisition-report.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
              print('Saved artifact downloaded; hash, authenticated decryption, and SQLite integrity verified. No vendor requests or Jev calls.')
          except Exception:
              print('ARCHIVE_RESTORE_VERIFICATION_FAILED');raise SystemExit(2)
          PY
      - name: Audit every saved article and report aggregate coverage only
        run: python tools/jev_news_archive_audit.py --expected-index .private-news/universe-index.json --output news-verification/audit.json
      - name: Save raw-free verification report
        uses: actions/upload-artifact@v4
        with:
          name: jev-news-verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: |
            news-verification/acquisition-report.json
            news-verification/audit.json
