name: Research dilution magnitude

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Study start date"
        required: true
        default: "2026-01-01"
      end:
        description: "Study end date (frozen v1 sample)"
        required: true
        default: "2026-09-21"
      max_events:
        description: "0 = all impact-qualified events"
        required: true
        default: "0"
  push:
    branches:
      - research/event-risk-20260930
    paths:
      - scripts/event_risk/build_dilution_magnitude.py
      - tests/test_dilution_magnitude.py
      - .github/workflows/research-dilution-magnitude.yml

permissions:
  contents: write

concurrency:
  group: research-dilution-magnitude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dilution-magnitude:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Research branch guard
        run: test "${{ github.ref_name }}" = "research/event-risk-20260930"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Verify Massive secret
        run: test -n "$MASSIVE_API_KEY"

      - name: Unit tests
        run: python -m pytest -q tests/test_dilution_magnitude.py

      - name: Build dilution magnitude curve
        env:
          STUDY_START: ${{ inputs.start || '2026-01-01' }}
          STUDY_END: ${{ inputs.end || '2026-09-21' }}
          MAX_EVENTS: ${{ inputs.max_events || '0' }}
        run: |
          python scripts/event_risk/build_dilution_magnitude.py \
            --repo-root . \
            --start "$STUDY_START" \
            --end "$STUDY_END" \
            --max-events "$MAX_EVENTS" \
            --sleep 13

      - name: Commit research artifacts
        run: |
          cp research/event_risk/dilution-magnitude-v1.json /tmp/dilution-magnitude-v1.json
          cp maintenance/dilution-magnitude-v1-20260930.md /tmp/dilution-magnitude-v1-20260930.md
          git fetch origin research/event-risk-20260930
          git reset --hard origin/research/event-risk-20260930
          cp /tmp/dilution-magnitude-v1.json research/event_risk/dilution-magnitude-v1.json
          cp /tmp/dilution-magnitude-v1-20260930.md maintenance/dilution-magnitude-v1-20260930.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/event_risk/dilution-magnitude-v1.json maintenance/dilution-magnitude-v1-20260930.md
          if git diff --cached --quiet; then
            echo "No artifact changes."
            exit 0
          fi
          git commit -m "research: quantify dilution magnitude impact"
          git push origin HEAD:research/event-risk-20260930
