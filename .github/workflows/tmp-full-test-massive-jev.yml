name: Temporary full Massive Jev tests
on:
  push:
    branches: [improve/massive-jev-pipeline-20260930]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: >-
          python -m pip install "numpy<3" "pandas<3" "yfinance==0.2.66"
          "psycopg[binary]==3.2.10" requests beautifulsoup4 lxml pytest pyyaml
      - run: python -m compileall scripts tests -q
      - run: >-
          python -c "import yaml,pathlib;
          [yaml.safe_load(p.read_text()) for p in pathlib.Path('.github/workflows').glob('*.yml')]"
      - run: python -m pytest -q
