name: Research universal expectation gap

on:
  workflow_dispatch:
    inputs:
      max_deep:
        description: "Deep-enriched candidate count"
        required: true
        default: "12"
  push:
    branches:
      - research/universal-expectation-gap-20260930
    paths:
      - research/expectation_gap/ueg-jev-en-v1.json
      - scripts/expectation_gap/run_universal_expectation_gap.py
      - tests/test_universal_expectation_gap.py
      - .github/workflows/research-universal-expectation-gap.yml

permissions:
  contents: write

concurrency:
  group: universal-expectation-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
      JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
      JEV_API_URL: ${{ vars.JEV_API_URL || 'https://jev-investment-engine.vercel.app/api/jev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Research branch guard
        run: test "${{ github.ref_name }}" = "research/universal-expectation-gap-20260930"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Verify secrets
        run: |
          test -n "$MASSIVE_API_KEY"
          test -n "$JEV_API_SECRET"

      - name: Unit tests
        run: python -m pytest -q tests/test_universal_expectation_gap.py

      - name: Run universal expectation-gap research
        env:
          MAX_DEEP: ${{ inputs.max_deep || '12' }}
        run: |
          python scripts/expectation_gap/run_universal_expectation_gap.py \
            --root . \
            --max-deep "$MAX_DEEP" \
            --news-limit 8 \
            --lookback-days 30 \
            --massive-min-interval 13

      - name: Commit research outputs
        run: |
          cp research/expectation_gap/universal-expectation-gap-v1.json /tmp/universal-expectation-gap-v1.json
          cp maintenance/universal-expectation-gap-v1-20260930.md /tmp/universal-expectation-gap-v1-20260930.md
          git fetch origin research/universal-expectation-gap-20260930
          git reset --hard origin/research/universal-expectation-gap-20260930
          mkdir -p research/expectation_gap maintenance
          cp /tmp/universal-expectation-gap-v1.json research/expectation_gap/universal-expectation-gap-v1.json
          cp /tmp/universal-expectation-gap-v1-20260930.md maintenance/universal-expectation-gap-v1-20260930.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/expectation_gap/universal-expectation-gap-v1.json maintenance/universal-expectation-gap-v1-20260930.md
          if git diff --cached --quiet; then
            echo "No research artifact changes."
            exit 0
          fi
          git commit -m "research: build universal expectation gap"
          git push origin HEAD:research/universal-expectation-gap-20260930
