name: Publish dashboard display fixes
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-display-fixes.yml', 'scripts/dashboard_fixes.py', 'scripts/archive_tab.py', 'scripts/rotation_split.py', 'scripts/track_record.py', 'scripts/rule_refresh.py', 'scripts/rules_tab.py', 'scripts/swing_screener.py', 'scripts/pickup_watch.py', 'scripts/breakout_health.py', 'scripts/render_jev_ranking.py', 'assets/jev-ranking.js']
permissions:
  contents: write
concurrency:
  group: source-mc57-refresh
  cancel-in-progress: false
jobs:
  display:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore frozen assets for test fixtures
        run: tar -xJf bootstrap/recovery-assets.tar.xz
      - name: Install display verification dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' yfinance==0.2.66 requests beautifulsoup4 lxml pytest
      - name: Restore the last refresh's saved inputs (no market re-acquisition)
        uses: actions/cache/restore@v4
        with:
          # identical path list to the refresh's save step (the cache version depends on it)
          path: |
            work/ohlcv.csv
            work/mc57-authoritative.json
            work/massive-reference.json
            work/massive-grouped.json
            work/universes/
            work/mc57-corrections/
          key: source-mc57-ohlcv-display-${{ github.run_id }}
          restore-keys: source-mc57-ohlcv-
      - name: Restore the last refresh's market inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            work/mc57-prices.csv
            work/market-inputs-cache.json
            work/massive-etf-grouped.json
          key: source-mc57-fallback-display-${{ github.run_id }}
          restore-keys: source-mc57-fallback-
      - name: Apply display adapters using the already published data
        run: |
          python scripts/dashboard_fixes.py
          python scripts/archive_tab.py --html source-mc57.html
          python scripts/rotation_split.py --html source-mc57.html
          python scripts/rule_refresh.py
          python scripts/track_record.py
          python scripts/render_jev_ranking.py
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from render_jev_ranking import bind_ranking
          path = Path('data/jev-ranking.json')
          ranking = json.loads(path.read_text())
          manifest = json.loads(Path('latest-manifest.json').read_text())
          # One-time migration of the previously embedded ranking, with no
          # changed stock inputs. Never rebind later stale evaluations.
          if not ranking.get('source_html_sha256') and ranking.get('session_date') == manifest.get('session_date'):
              bind_ranking(Path('source-mc57.html'), path)
          PY
      - name: Verify deterministic contracts
        run: python -m pytest
      - name: Verify all desktop and mobile tabs
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
          node tests/market_history_ui.cjs
      - name: Scan public outputs
        run: python scripts/phase_a0/scan_secrets.py --root . source-mc57.html assets data/jev-ranking.json data/mc57.json
      - name: Publish verified display only
        run: |
          git fetch origin main --depth=1
          if test "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)"; then
            echo 'main changed during display verification; refusing stale publication'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- source-mc57.html
          git add -f -- data/jev-ranking.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply verified dashboard display fixes [skip refresh]'
          git push origin HEAD:main
