name: Verify dashboard code and mobile display
on:
  workflow_dispatch:
  pull_request:
    paths: ['scripts/**', 'src/**', 'tests/**', 'assets/**', '.github/workflows/**', 'source-mc57.html']
  push:
    branches: [main]
    paths: ['scripts/**', 'src/**', 'tests/**', 'assets/**', '.github/workflows/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Restore frozen assets for deterministic fixtures
        run: tar -xJf bootstrap/recovery-assets.tar.xz
      - name: Install test dependencies
        run: python -m pip install 'numpy<3' 'pandas<3' yfinance==0.2.66 requests beautifulsoup4 lxml pytest
      - name: Test session, provider, archive and presentation contracts
        run: python -m pytest
      - name: Install browser dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Restore the last refresh's saved inputs (no market re-acquisition)
        uses: actions/cache/restore@v4
        with:
          # identical path list to the refresh's save step (the cache version depends on it)
          path: |
            work/ohlcv.csv
            work/mc57-authoritative.json
            work/massive-reference.json
            work/massive-grouped.json
            work/universes/
            work/mc57-corrections/
          key: source-mc57-ohlcv-display-${{ github.run_id }}
          restore-keys: source-mc57-ohlcv-
      - name: Restore the last refresh's market inputs
        uses: actions/cache/restore@v4
        with:
          path: |
            work/mc57-prices.csv
            work/market-inputs-cache.json
            work/massive-etf-grouped.json
          key: source-mc57-fallback-display-${{ github.run_id }}
          restore-keys: source-mc57-fallback-
      - name: Verify display adapters using published inputs
        run: |
          python scripts/dashboard_fixes.py
          python scripts/archive_tab.py --html source-mc57.html
          python scripts/setups_curate.py --html source-mc57.html
          python scripts/rotation_split.py --html source-mc57.html
          python scripts/rule_refresh.py
          python scripts/breadth_refresh.py
          python scripts/ipo_base.py
          python scripts/rsline_lead.py
          python scripts/option_layout.py
          python scripts/track_record.py
          python scripts/audit_display.py
          python scripts/naming.py
          python scripts/render_jev_ranking.py
          python scripts/design_system.py
      - name: Verify all tabs, mobile overflow and Jev freshness
        run: node tests/market_history_ui.cjs
      - name: Verify public outputs contain no credentials
        run: python scripts/phase_a0/scan_secrets.py --root . source-mc57.html assets data/jev-ranking.json data/mc57.json
