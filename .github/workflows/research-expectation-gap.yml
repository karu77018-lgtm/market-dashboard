name: Research expectation-gap Jev overlay (optional)

on:
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Bounded optional Jev overlay candidate count"
        required: true
        default: "60"

permissions:
  contents: write

concurrency:
  group: research-expectation-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expectation-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
      JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
      JEV_API_URL: ${{ vars.JEV_API_URL || 'https://jev-investment-engine.vercel.app/api/jev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Research branch guard
        run: test "${{ github.ref_name }}" = "research/universal-expectation-gap-20260930"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install requests pytest

      - name: Verify secrets
        run: |
          test -n "$MASSIVE_API_KEY"
          test -n "$JEV_API_SECRET"

      - name: Run expectation-gap tests
        run: python -m pytest -q tests/test_expectation_gap_shadow.py tests/test_jev_live_shadow.py

      - name: Run optional Jev overlay research shadow
        env:
          MAX_CANDIDATES: ${{ inputs.max_candidates || '60' }}
        run: |
          python scripts/run_expectation_gap_shadow.py \
            --root . \
            --output research/expectation_gap/jev-overlay-current-v1.json \
            --history-dir research/expectation_gap/jev-overlay-history \
            --report maintenance/expectation-gap-jev-overlay-latest.md \
            --max-candidates "$MAX_CANDIDATES" \
            --news-lookback-days 21 \
            --disclosure-lookback-days 120 \
            --massive-min-interval 13

      - name: Commit optional Jev overlay outputs race-safely
        run: |
          cp research/expectation_gap/jev-overlay-current-v1.json /tmp/jev-overlay-current-v1.json
          rm -rf /tmp/jev-overlay-history
          cp -R research/expectation_gap/jev-overlay-history /tmp/jev-overlay-history
          cp maintenance/expectation-gap-jev-overlay-latest.md /tmp/expectation-gap-jev-overlay-latest.md
          git fetch origin research/universal-expectation-gap-20260930
          git reset --hard origin/research/universal-expectation-gap-20260930
          mkdir -p research/expectation_gap maintenance
          cp /tmp/jev-overlay-current-v1.json research/expectation_gap/jev-overlay-current-v1.json
          rm -rf research/expectation_gap/jev-overlay-history
          cp -R /tmp/jev-overlay-history research/expectation_gap/jev-overlay-history
          cp /tmp/expectation-gap-jev-overlay-latest.md maintenance/expectation-gap-jev-overlay-latest.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/expectation_gap/jev-overlay-current-v1.json research/expectation_gap/jev-overlay-history maintenance/expectation-gap-jev-overlay-latest.md
          if git diff --cached --quiet; then
            echo "No optional Jev overlay output changes."
            exit 0
          fi
          git commit -m "research: update optional expectation-gap Jev overlay"
          git push origin HEAD:research/universal-expectation-gap-20260930
