name: Deploy verified Pages

# GitHub Pages publishes only a commit that passed this gate (audit F14).
# Requires Settings -> Pages -> Source = "GitHub Actions"; until then the deploy
# step is skipped and the branch-based Pages build keeps serving main.
on:
  workflow_dispatch:
  push:
    branches: [main]
  # Bot commits pushed with GITHUB_TOKEN do not fire `push`; the publishing
  # workflows' completion does.
  workflow_run:
    workflows: ["Refresh source-mc57", "Publish dashboard display fixes", "Refresh Jev shadow",
                "Complete dashboard restoration"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      enabled: ${{ steps.mode.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Pin the commit under review
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Check that Pages publishes from Actions
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages build type: $mode"
          if test "$mode" = "workflow"; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install gate dependencies
        run: python -m pip install 'numpy<3' 'pandas<3'
      - name: Release gate on committed files
        run: python scripts/verify_release.py --root .
      - name: Public outputs contain no credentials
        run: python scripts/phase_a0/scan_secrets.py --root . source-mc57.html assets data/jev-ranking.json data/mc57.json
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: All tabs render on desktop and iPhone widths
        run: node tests/market_history_ui.cjs
      - name: Assemble the site from exactly this commit
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude .git --exclude .github --exclude node_modules --exclude work ./ "$RUNNER_TEMP/site/"
          test -f "$RUNNER_TEMP/site/index.html" || printf '%s\n' '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=source-mc57.html"><link rel="canonical" href="source-mc57.html"><title>MC57</title><a href="source-mc57.html">MC57</a>' > "$RUNNER_TEMP/site/index.html"
          echo "${{ steps.sha.outputs.sha }}" > "$RUNNER_TEMP/site/release-sha.txt"
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.enabled == 'true'
        with: {path: '${{ runner.temp }}/site'}

  deploy:
    needs: verify
    if: needs.verify.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - run: echo "published ${{ needs.verify.outputs.sha }}"
