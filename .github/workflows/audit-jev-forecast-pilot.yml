name: Audit saved Jev forecast pilot
on:
  push:
    branches: [research/jev-forecast-validation-20260929]
    paths: ['tools/audit_jev_forecast_pilot.py', '.github/workflows/audit-jev-forecast-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install cryptography==46.0.4
      - name: Restore encrypted completed research and independently recompute scores
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: python tools/audit_jev_forecast_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: jev-forecast-pilot-audit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          path: pilot-audit-output/*.json
