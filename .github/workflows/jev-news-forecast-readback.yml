name: Verify Jev pilot persistence and news sensitivity
on:
  push:
    branches: [research/jev-news-forecast-pilot-20260929]
    paths: [tools/jev_pilot_audit.py, tools/jev_pilot_followup.py, .github/workflows/jev-news-forecast-readback.yml]
permissions:
  actions: read
  contents: read
concurrency:
  group: jev-saved-news-forecast-pilot
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned dependencies
        run: python -m pip install requests==2.32.5 cryptography==46.0.4 pytest==9.0.2
      - name: Recheck offline safeguards
        run: python -m pytest tools/jev_pilot/test_pilot.py -q
      - name: Restore recorded pilot requests and raw responses
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,os,subprocess,zipfile
          try:
              p=pathlib.Path('.private-pilot-check');p.mkdir(exist_ok=True)
              path=p/'source.zip'
              with path.open('wb') as f:subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/11040085595/zip'],stdout=f,stderr=subprocess.PIPE,check=True)
              if hashlib.sha256(path.read_bytes()).hexdigest()!='42498ad898d75bd6a0c51a3f9c556f3fbe993465648843c2689480c4deb481a1':raise RuntimeError('zip')
              with zipfile.ZipFile(path) as z:
                  sealed=z.read('results.sqlite.gz.aesgcm');r=json.loads(z.read('report.json'))
              if hashlib.sha256(sealed).hexdigest()!=r['encrypted_sha256']:raise RuntimeError('cipher')
              (p/'source.aesgcm').write_bytes(sealed)
              subprocess.run(['python','research/news_backfill/archive.py','restore','--archive',str(p/'source.aesgcm'),'--db',str(p/'source.sqlite')],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              print('Saved Jev inputs and raw responses authenticated and restored')
          except Exception:print('RESTORE_FAILED');raise SystemExit(2)
          PY
      - name: Audit saved inputs and execute at most seven bounded followup calls
        id: followup
        continue-on-error: true
        env:
          JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: python tools/jev_pilot_followup.py
      - name: Save authenticated followups and raw-free audit
        if: always()
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: jev-news-pilot-readback-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: error
          compression-level: 0
          path: |
            pilot-check-output/audit.json
            pilot-check-output/followup-report.json
            pilot-check-output/followup.sqlite.gz.aesgcm
      - name: Check result
        if: always() && (steps.followup.outcome != 'success' || steps.archive.outcome != 'success')
        run: exit 1
