name: Temporary Massive Jev tests
on:
  push:
    branches: [improve/massive-jev-pipeline-20260930]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install numpy pandas requests pytest
      - run: python -m pytest tests/test_provider_inputs.py tests/test_jev_live_shadow.py tests/test_render_jev_ranking.py -q
