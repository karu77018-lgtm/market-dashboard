name: Smoke Jev question schema

on:
  push:
    branches:
      - research/universal-expectation-gap-20260930
    paths:
      - scripts/smoke_jev_question_set.py
      - research/expectation_gap/question-set-en-v2.json
      - .github/workflows/smoke-jev-question-schema.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
      JEV_API_URL: ${{ vars.JEV_API_URL || 'https://jev-investment-engine.vercel.app/api/jev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: test -n "$JEV_API_SECRET"
      - run: python scripts/smoke_jev_question_set.py
