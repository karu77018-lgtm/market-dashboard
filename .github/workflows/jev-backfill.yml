name: Jev narrative backfill (research)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "first event index"
        default: "0"
      limit:
        description: "number of events"
        default: "10000"
      variants:
        description: "masked,plain"
        default: "masked,plain"

permissions:
  contents: read

concurrency:
  group: jev-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
      JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
      JEV_API_URL: ${{ vars.JEV_API_URL || 'https://jev-investment-engine.vercel.app/api/jev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests pytest
      - run: python -m pytest tests/test_jev_backfill.py -q
      - name: Run backfill (derived numbers only; vendor text stays in memory)
        working-directory: scripts
        run: >-
          python jev_backfill.py --events ../research/jev-backfill-events-v1.json
          --output ../.preservation/jev/backfill-v1.json
          --start "${{ inputs.start }}" --limit "${{ inputs.limit }}" --variants "${{ inputs.variants }}"
      - name: Upload derived results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-backfill-${{ github.run_id }}
          path: .preservation/jev/backfill-v1.json
          if-no-files-found: warn
          retention-days: 30
