name: Jev saved-news real forecast pilot
on:
  push:
    branches: [research/jev-news-forecast-pilot-20260929]
    paths: [tools/jev_pilot/**, .github/workflows/jev-news-forecast-pilot.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jev-saved-news-forecast-pilot
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'karu77018-lgtm/market-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install evaluation dependencies
        run: python -m pip install requests==2.32.5 cryptography==46.0.4 pytest==9.0.2 pandas==2.3.3 pyarrow==21.0.0
      - name: Test input cutoffs probability aggregation and no synthetic tails
        run: python -m pytest tools/jev_pilot/test_pilot.py -q
      - name: Require existing evaluation and preservation secrets
        env:
          JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: |
          test -n "$JEV_API_SECRET"
          test -n "$ARCHIVE_PASSPHRASE"
          mkdir -p .private-pilot pilot-output
      - name: Retrieve authenticated saved news without new Massive calls
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,os,subprocess,zipfile
          try:
              private=pathlib.Path('.private-pilot')
              archive=private/'download.zip'
              with archive.open('wb') as out:
                  subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/actions/artifacts/11038219065/zip'],stdout=out,stderr=subprocess.PIPE,check=True)
              if hashlib.sha256(archive.read_bytes()).hexdigest()!='f99f6d3c14f1e6b62497115f166dec3d9768a52a1fdf393be89a68e2a0ce2196':raise RuntimeError('hash')
              with zipfile.ZipFile(archive) as z:
                  sealed=z.read('news.sqlite.gz.aesgcm');meta=json.loads(z.read('report.json'))
              if hashlib.sha256(sealed).hexdigest()!=meta['encrypted_sha256']:raise RuntimeError('cipher')
              (private/'news.aesgcm').write_bytes(sealed)
              subprocess.run(['python','research/news_backfill/archive.py','restore','--archive',str(private/'news.aesgcm'),'--db',str(private/'news.sqlite')],stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=True)
              print('Verified saved news restored. No holdings and no new Massive requests.')
          except Exception:
              print('SAVED_NEWS_RESTORE_FAILED');raise SystemExit(2)
          PY
      - name: Read frozen public prices and dashboard
        uses: actions/checkout@v4
        with:
          ref: d84a70dd46df011df502217f2737ed08a1e90fa2
          path: pilot-data
          persist-credentials: false
          sparse-checkout: |
            chart-data
            scripts/phase_a0
      - name: Read existing QQQ price archive
        uses: actions/checkout@v4
        with:
          ref: 79219a30227046f9651444ab8f7ab7c794a500cd
          path: market-input
          persist-credentials: false
          sparse-checkout: research/tqqq_swing/data
      - name: Evaluate forty public names with saved article contents and numeric state
        id: forecast
        continue-on-error: true
        env:
          JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
          JEV_API_URL: https://jev-investment-engine.vercel.app/api/jev
        run: python tools/jev_pilot/pilot.py --root .
      - name: Save encrypted requests and raw answers plus derived report
        id: archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-news-forecast-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
          path: |
            pilot-output/results.sqlite.gz.aesgcm
            pilot-output/report.json
      - name: Save encrypted pilot to existing private Drive
        id: drive
        if: steps.archive.outcome == 'success'
        continue-on-error: true
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python pilot-data/scripts/phase_a0/upload_google_drive.py pilot-output/results.sqlite.gz.aesgcm > .private-pilot/drive-receipt.json 2> .private-pilot/drive-error.log || { echo 'DRIVE_COPY_FAILED_ENCRYPTED_ARTIFACT_RETAINED'; exit 1; }
          echo 'Private Drive result archive saved'
      - name: Report aggregate execution only
        if: always()
        env:
          ARCHIVE_ID: ${{ steps.archive.outputs.artifact-id }}
          DRIVE_OUTCOME: ${{ steps.drive.outcome }}
        run: |
          python - <<'PY'
          import json,pathlib,os
          path=pathlib.Path('pilot-output/report.json')
          report=json.loads(path.read_text()) if path.exists() else {'status':'failed','error':'NO_REPORT'}
          safe={k:v for k,v in report.items() if k not in ('rows','failures')}
          safe['artifact_id']=os.environ.get('ARCHIVE_ID');safe['drive_upload']=os.environ.get('DRIVE_OUTCOME')
          print(json.dumps(safe,sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Jev actual saved-news forecast pilot\n```json\n'+json.dumps(safe,indent=2)+'\n```\n')
          PY
      - name: Fail when no actual forecast or preservation
        if: always() && (steps.forecast.outcome != 'success' || steps.archive.outcome != 'success')
        run: exit 1
