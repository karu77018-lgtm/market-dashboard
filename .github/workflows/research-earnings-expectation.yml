name: Research earnings expectation core

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Study start date"
        required: true
        default: "2026-01-01"
      end:
        description: "Study end date"
        required: true
        default: "2026-09-21"
  push:
    branches:
      - research/event-risk-20260930
    paths:
      - scripts/event_risk/build_earnings_expectation_core.py
      - tests/test_earnings_expectation_core.py
      - jev-investment-engine/config/event-risk-earnings-question-set-v1.json
      - .github/workflows/research-earnings-expectation.yml

permissions:
  contents: write

concurrency:
  group: research-earnings-expectation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  expectation-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Research branch guard
        run: test "${{ github.ref_name }}" = "research/event-risk-20260930"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify Massive secret
        run: test -n "$MASSIVE_API_KEY"
      - name: Unit tests
        run: python -m pytest -q tests/test_earnings_expectation_core.py tests/test_dilution_magnitude.py
      - name: Build expectation core
        env:
          STUDY_START: ${{ inputs.start || '2026-01-01' }}
          STUDY_END: ${{ inputs.end || '2026-09-21' }}
        run: |
          python scripts/event_risk/build_earnings_expectation_core.py \
            --repo-root . --start "$STUDY_START" --end "$STUDY_END" --sleep 13
      - name: Commit research artifact
        run: |
          cp research/event_risk/earnings-expectation-load-core-v1.json /tmp/earnings-expectation-load-core-v1.json
          git fetch origin research/event-risk-20260930
          git reset --hard origin/research/event-risk-20260930
          cp /tmp/earnings-expectation-load-core-v1.json research/event_risk/earnings-expectation-load-core-v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/event_risk/earnings-expectation-load-core-v1.json
          if git diff --cached --quiet; then
            echo "No artifact changes."
            exit 0
          fi
          git commit -m "research: build earnings expectation load core"
          git push origin HEAD:research/event-risk-20260930
