name: Refresh source-mc57

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 1-5"
  push:
    branches: [main]
    paths: [".github/workflows/refresh-source-mc57.yml", "scripts/**", "src/**", "bootstrap/**", "sources/**", "seed/**", "tests/**"]

permissions:
  actions: read
  contents: write

concurrency:
  group: source-mc57-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_API || secrets.FRED_KEY || secrets.FRED }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - name: Restore audited source assets
        run: tar -xJf bootstrap/recovery-assets.tar.xz
      - name: Install exact acquisition dependencies
        run: >-
          python -m pip install "numpy<3" "pandas<3" "yfinance==0.2.66"
          "psycopg[binary]==3.2.10" requests beautifulsoup4 lxml pytest
      - name: Verify FRED secret
        run: test -n "$FRED_API_KEY"
      - name: Verify Massive secret
        continue-on-error: true
        run: test -n "$MASSIVE_API_KEY"
      - name: Verify Google Drive preservation configuration
        id: drive_config
        continue-on-error: true
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          test -n "$GOOGLE_DRIVE_CLIENT_ID"
          test -n "$GOOGLE_DRIVE_CLIENT_SECRET"
          test -n "$GOOGLE_DRIVE_REFRESH_TOKEN"
          test -n "$GOOGLE_DRIVE_FOLDER_ID"
      - name: Detect optional Neon configuration
        id: neon_config
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if test -n "$NEON_DATABASE_URL"; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run deterministic provider tests
        run: python -m pytest
      - name: Restore prior successful OHLCV baseline
        uses: actions/cache@v4
        with:
          path: |
            work/ohlcv.csv
            work/massive-reference.json
            work/massive-grouped.json
          key: source-mc57-ohlcv-${{ github.run_id }}
          restore-keys: source-mc57-ohlcv-
      - name: Acquire current session and calculate MC57
        shell: bash
        run: |
          set +e
          python scripts/refresh_mc57.py --repo-root . 2>&1 | tee work/refresh.log
          status="${PIPESTATUS[0]}"
          if test "$status" -ne 0; then
            code="$(grep '^SOURCE_MC57_FAILURE=' work/refresh.log | tail -n 1)"
            test -n "$code" || code="SOURCE_MC57_FAILURE=UNKNOWN"
            code="${code//'%'/'%25'}"
            echo "::error title=source-mc57 acquisition::${code}"
            exit "$status"
          fi
      - name: Preserve failed acquisition cache
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            work/ohlcv.csv
            work/massive-reference.json
            work/massive-grouped.json
          key: source-mc57-ohlcv-${{ github.run_id }}
      - name: Build frozen source page with current data
        run: >-
          python scripts/build_exact_source_mc57_clone.py --repo-root . --data-dir data
          --source-dir sources/build_dashboard_4 --work-dir work --output source-mc57.html
      - name: Add independent ticker candles without changing the original layout
        run: |
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          python scripts/enhance_source_mc57.py --html source-mc57.html --ohlcv work/ohlcv.csv \
            --chart-dir chart-data --session "$session"
      - name: Resolve immutable run metadata
        id: run_meta
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          started_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .run_started_at)"
          test -n "$started_at" && test "$started_at" != "null"
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          echo "actions_started_at=$started_at" >> "$GITHUB_OUTPUT"
          echo "session_date=$session" >> "$GITHUB_OUTPUT"
      - name: Run Jev live shadow research
        id: jev_shadow
        continue-on-error: true
        env:
          JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
          JEV_API_URL: ${{ vars.JEV_API_URL || 'https://jev-investment-engine.vercel.app/api/jev' }}
        run: >-
          python scripts/run_jev_live_shadow.py --root .
          --max-candidates 70 --max-news 8 --lookback-days 30
      - name: Save Jev shadow audit summary
        if: always() && steps.jev_shadow.outcome != 'skipped'
        id: jev_shadow_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: jev-live-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: warn
          path: .preservation/jev/live-shadow-summary.json
      - name: Report Jev shadow failure
        if: always() && steps.jev_shadow.outcome == 'failure'
        run: |
          echo "::warning title=Jev live shadow failed::Dashboard publication and Phase A-0 preservation will continue."
          echo "Jev is an isolated research layer; inspect its step and audit summary without treating the dashboard run as failed." >> "$GITHUB_STEP_SUMMARY"
      - name: Render isolated Jev expected-value ranking tab
        if: always()
        run: >-
          python scripts/render_jev_ranking.py
          --html source-mc57.html --ranking data/jev-ranking.json
      - name: Publication gates
        if: always()
        id: publication_gates
        run: python scripts/validate_publication.py --root .
      - name: Resolve successful monthly-full policy
        id: snapshot_policy
        env: {GH_TOKEN: "${{ github.token }}"}
        run: >-
          python scripts/phase_a0/resolve_snapshot_mode.py --root .
          --session-date "${{ steps.run_meta.outputs.session_date }}"
          --repository "${{ github.repository }}" --ref main
      - name: Secret leak gate
        id: secret_scan
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
          JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: >-
          python scripts/phase_a0/scan_secrets.py --root . --include-tracked
          source-mc57.html chart-data latest-manifest.json data work/ohlcv.csv
          work/massive-reference.json work/massive-grouped.json
      - name: Build monthly-full or daily-delta private snapshot and SHA-256 manifest
        id: snapshot
        run: >-
          python scripts/phase_a0/build_snapshot.py --root .
          --session-date "${{ steps.run_meta.outputs.session_date }}" --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --actions-started-at "${{ steps.run_meta.outputs.actions_started_at }}"
          --code-sha "${{ github.sha }}" --repository "${{ github.repository }}"
          --workflow-ref "${{ github.workflow_ref }}"
          --snapshot-mode "${{ steps.snapshot_policy.outputs.snapshot_mode }}"
      - name: Create private Google Drive snapshot
        if: steps.drive_config.outcome == 'success'
        id: drive_upload
        continue-on-error: true
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python scripts/phase_a0/upload_google_drive.py "${{ steps.snapshot.outputs.snapshot_path }}"
      - name: Write run-id hash history
        if: steps.drive_upload.outcome == 'success'
        id: hash_record
        continue-on-error: true
        run: >-
          python scripts/phase_a0/write_hash_record.py --root .
          --session-date "${{ steps.run_meta.outputs.session_date }}" --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --actions-started-at "${{ steps.run_meta.outputs.actions_started_at }}"
          --recorded-at "${{ steps.snapshot.outputs.recorded_at }}" --code-sha "${{ github.sha }}"
          --sha256 "${{ steps.snapshot.outputs.snapshot_sha256 }}"
          --manifest-sha256 "${{ steps.snapshot.outputs.manifest_sha256 }}"
          --drive-file-id "${{ steps.drive_upload.outputs.drive_file_id }}"
          --drive-file-name "${{ steps.drive_upload.outputs.drive_file_name }}"
          --drive-created-at "${{ steps.drive_upload.outputs.drive_created_time }}"
          --repository "${{ github.repository }}" --workflow-ref "${{ github.workflow_ref }}"
          --source google_drive_live
          --snapshot-mode "${{ steps.snapshot.outputs.snapshot_mode }}"
      - name: Optionally append copy to Neon manifest
        if: steps.drive_upload.outcome == 'success' && steps.neon_config.outputs.enabled == 'true'
        id: neon_record
        continue-on-error: true
        env: {NEON_DATABASE_URL: "${{ secrets.NEON_DATABASE_URL }}"}
        run: >-
          python scripts/phase_a0/neon_manifest.py
          record --session-date "${{ steps.run_meta.outputs.session_date }}"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --actions-started-at "${{ steps.run_meta.outputs.actions_started_at }}"
          --recorded-at "${{ steps.snapshot.outputs.recorded_at }}" --code-sha "${{ github.sha }}"
          --repository "${{ github.repository }}" --workflow-ref "${{ github.workflow_ref }}"
          --snapshot-sha256 "${{ steps.snapshot.outputs.snapshot_sha256 }}"
          --manifest-sha256 "${{ steps.snapshot.outputs.manifest_sha256 }}"
          --snapshot-bytes "${{ steps.snapshot.outputs.snapshot_bytes }}"
          --drive-file-id "${{ steps.drive_upload.outputs.drive_file_id }}"
          --drive-file-name "${{ steps.drive_upload.outputs.drive_file_name }}"
          --drive-created-at "${{ steps.drive_upload.outputs.drive_created_time }}"
          --source google_drive_live
      - name: Build interim encrypted private snapshot
        if: always() && steps.snapshot.outcome == 'success' && steps.hash_record.outcome != 'success'
        id: interim
        continue-on-error: true
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
          SNAP: ${{ steps.snapshot.outputs.snapshot_path }}
          SESSION_DATE: ${{ steps.run_meta.outputs.session_date }}
          ACTIONS_STARTED_AT: ${{ steps.run_meta.outputs.actions_started_at }}
          RECORDED_AT: ${{ steps.snapshot.outputs.recorded_at }}
          SNAPSHOT_SHA256: ${{ steps.snapshot.outputs.snapshot_sha256 }}
          MANIFEST_SHA256: ${{ steps.snapshot.outputs.manifest_sha256 }}
          SNAPSHOT_MODE: ${{ steps.snapshot.outputs.snapshot_mode }}
        run: |
          test -n "$ARCHIVE_PASSPHRASE"
          test -f "$SNAP"
          enc_path="$SNAP.enc"
          sha_path="$SNAP.sha256"
          metadata_path="$SNAP.interim.json"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in "$SNAP" -out "$enc_path" -pass env:ARCHIVE_PASSPHRASE
          encrypted_sha256="$(sha256sum "$enc_path" | cut -d' ' -f1)"
          sha256sum "$SNAP" "$enc_path" > "$sha_path"
          python - "$metadata_path" "$encrypted_sha256" <<'PY'
          import json
          import os
          import sys

          payload = {
              "schema_version": "phase-a0-interim-v2",
              "source": "interim_encrypted_artifact",
              "session_date": os.environ["SESSION_DATE"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "github_actions_started_at": os.environ["ACTIONS_STARTED_AT"],
              "recorded_at": os.environ["RECORDED_AT"],
              "code_sha": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_ref": os.environ["GITHUB_WORKFLOW_REF"],
              "snapshot_sha256": os.environ["SNAPSHOT_SHA256"],
              "manifest_sha256": os.environ["MANIFEST_SHA256"],
              "snapshot_mode": os.environ["SNAPSHOT_MODE"],
              "encrypted_sha256": sys.argv[2],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(payload, handle, ensure_ascii=False, indent=2, sort_keys=True)
              handle.write("\n")
          PY
          echo "enc_path=$enc_path" >> "$GITHUB_OUTPUT"
          echo "sha_path=$sha_path" >> "$GITHUB_OUTPUT"
          echo "metadata_path=$metadata_path" >> "$GITHUB_OUTPUT"
      - name: Save interim encrypted snapshot
        if: steps.interim.outcome == 'success'
        id: interim_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: private-encrypted-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ steps.interim.outputs.enc_path }}
            ${{ steps.interim.outputs.sha_path }}
            ${{ steps.interim.outputs.metadata_path }}
      - name: Record successful monthly full snapshot
        if: >-
          always() && steps.snapshot.outputs.snapshot_mode == 'full' && (
            steps.hash_record.outcome == 'success' ||
            steps.interim_artifact.outcome == 'success'
          )
        id: full_marker
        continue-on-error: true
        env:
          DRIVE_FILE_ID: ${{ steps.drive_upload.outputs.drive_file_id }}
        run: |
          if test "${{ steps.hash_record.outcome }}" = "success"; then
            source="google_drive_live"
            reference="$DRIVE_FILE_ID"
          else
            source="interim_encrypted_artifact"
            reference="private-encrypted-snapshot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          fi
          test -n "$reference"
          python scripts/phase_a0/write_full_snapshot_marker.py --root . \
            --session-date "${{ steps.run_meta.outputs.session_date }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --code-sha "$GITHUB_SHA" \
            --snapshot-sha256 "${{ steps.snapshot.outputs.snapshot_sha256 }}" \
            --manifest-sha256 "${{ steps.snapshot.outputs.manifest_sha256 }}" \
            --preservation-source "$source" --preservation-reference "$reference"
      - name: Save public reproducibility artifact (vendor raw excluded)
        if: always() && steps.snapshot.outcome == 'success'
        id: public_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: source-mc57-preservation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          compression-level: 6
          include-hidden-files: true
          if-no-files-found: error
          path: |
            source-mc57.html
            chart-data/
            latest-manifest.json
            data/mc57.json
            data/state.json
            data/rs.json
            data/theme_membership.json
            data/jev-ranking.json
            ${{ steps.snapshot.outputs.manifest_path }}
            ${{ steps.hash_record.outputs.hash_record_path }}
            ${{ steps.full_marker.outputs.full_marker_path }}
      - name: Report primary preservation failure
        if: >-
          always() && (
            steps.drive_config.outcome == 'failure' ||
            steps.drive_upload.outcome == 'failure' ||
            steps.hash_record.outcome == 'failure' ||
            steps.full_marker.outcome == 'failure'
          )
        run: |
          echo "::warning title=Phase A-0 primary preservation failed::Dashboard publication and the public raw-free Artifact will continue."
          echo "## Phase A-0 preservation warning" >> "$GITHUB_STEP_SUMMARY"
          echo "Drive or its GitHub hash record was unavailable. The encrypted fallback and public raw-free Artifact still run; inspect the primary preservation steps." >> "$GITHUB_STEP_SUMMARY"
      - name: Report optional Neon failure
        if: always() && steps.neon_record.outcome == 'failure'
        run: |
          echo "::warning title=Optional Neon index failed::The Drive copy and GitHub hash record remain successful."
          echo "Neon is only a rebuildable index; Drive createdTime remains the live available_at authority." >> "$GITHUB_STEP_SUMMARY"
      - name: Report interim encrypted preservation
        if: steps.interim_artifact.outcome == 'success'
        run: |
          echo "::warning title=Phase A-0 interim preservation::Private Drive preservation failed; an encrypted 90-day fallback Artifact was saved."
          echo "## Phase A-0 interim preservation" >> "$GITHUB_STEP_SUMMARY"
          echo "Encrypted fallback saved for this run. Recover it to Drive before the 90-day retention expires." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish source-only outputs
        id: publish
        if: always() && steps.publication_gates.outcome == 'success' && steps.secret_scan.outcome == 'success' && steps.snapshot.outcome == 'success'
        env:
          HASH_RECORD_PATH: ${{ steps.hash_record.outputs.hash_record_path }}
          FULL_MARKER_PATH: ${{ steps.full_marker.outputs.full_marker_path }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source-mc57.html chart-data latest-manifest.json && git add -f -- data/jev-ranking.json
          if test -n "$HASH_RECORD_PATH"; then git add -- "$HASH_RECORD_PATH"; fi
          if test -n "$FULL_MARKER_PATH"; then git add -- "$FULL_MARKER_PATH"; fi
          if git diff --cached --quiet; then echo "No publication change"; exit 0; fi
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          git commit -m "Update source-mc57 through ${session} [skip refresh]"
          git push origin HEAD:main
      - name: Fail after publication when private preservation failed
        if: >-
          always() && steps.publish.outcome == 'success' && (
            steps.public_artifact.outcome == 'failure' ||
            steps.full_marker.outcome == 'failure' ||
            (
              steps.interim_artifact.outcome != 'success' && (
                steps.drive_config.outcome == 'failure' ||
                steps.drive_upload.outcome == 'failure' ||
                steps.hash_record.outcome == 'failure'
              )
            )
          )
        run: |
          echo "::error title=Phase A-0 preservation failed::Dashboard publication completed, but private preservation failed."
          exit 1
      - name: Fail after publication when Jev shadow failed
        if: >-
          always() && steps.publish.outcome == 'success' &&
          steps.jev_shadow.outcome == 'failure'
        run: |
          echo "::error title=Jev live shadow failed::Dashboard publication and preservation completed, but Jev research failed."
          exit 1
