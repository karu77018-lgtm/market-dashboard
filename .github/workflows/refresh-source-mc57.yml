name: Refresh source-mc57

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-source-mc57.yml"
      - "scripts/**"
      - "src/**"
      - "bootstrap/**"
      - "sources/**"
      - "seed/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: source-mc57-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_API || secrets.FRED_KEY || secrets.FRED }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore audited source assets
        run: tar -xJf bootstrap/recovery-assets.tar.xz

      - name: Install exact acquisition dependencies
        run: >-
          python -m pip install
          "numpy<3" "pandas<3" "yfinance==0.2.66"
          requests beautifulsoup4 lxml pytest

      - name: Verify FRED secret
        shell: bash
        run: test -n "$FRED_API_KEY"

      - name: Verify Massive secret
        shell: bash
        run: test -n "$MASSIVE_API_KEY"

      - name: Run deterministic provider tests
        run: python -m pytest

      - name: Restore prior successful OHLCV baseline
        uses: actions/cache@v4
        with:
          path: |
            work/ohlcv.csv
            work/massive-reference.json
            work/massive-grouped.json
          key: source-mc57-ohlcv-${{ github.run_id }}
          restore-keys: |
            source-mc57-ohlcv-

      - name: Acquire current session and calculate MC57
        shell: bash
        run: |
          set -o pipefail
          python scripts/refresh_mc57.py --repo-root . 2>&1 | tee work/refresh.log

      - name: Report sanitized acquisition failure
        if: failure()
        shell: bash
        run: |
          if test -f work/refresh.log; then
            tail -n 24 work/refresh.log | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              line="${line//$'\r'/'%0D'}"
              line="${line//$'\n'/'%0A'}"
              echo "::error title=source-mc57 acquisition::${line}"
            done
          fi

      - name: Build frozen source page with current data
        run: >-
          python scripts/build_exact_source_mc57_clone.py
          --repo-root . --data-dir data
          --source-dir sources/build_dashboard_4
          --work-dir work --output source-mc57.html

      - name: Add post-September-16 improvements
        shell: bash
        run: |
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          python scripts/enhance_source_mc57.py \
            --html source-mc57.html --ohlcv work/ohlcv.csv \
            --chart-dir chart-data --session "$session"

      - name: Publication gates
        run: python scripts/validate_publication.py --root .

      - name: Save reproducible preservation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-mc57-preservation-${{ github.run_id }}
          retention-days: 30
          compression-level: 6
          path: |
            source-mc57.html
            chart-data/
            latest-manifest.json
            data/mc57.json
            data/state.json
            data/rs.json
            data/market_inputs.json
            data/mktcap.json
            data/theme_membership.json
            data/provider_inputs.json
            work/ohlcv.csv
            work/massive-reference.json
            work/massive-grouped.json

      - name: Publish source-only outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source-mc57.html chart-data latest-manifest.json
          if git diff --cached --quiet; then
            echo "No publication change"
            exit 0
          fi
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          git commit -m "Update source-mc57 through ${session} [skip refresh]"
          git push origin HEAD:main
