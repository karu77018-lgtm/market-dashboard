name: Refresh source-mc57

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 1-5"
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-source-mc57.yml"
      - "scripts/**"
      - "src/**"
      - "bootstrap/**"
      - "sources/**"
      - "seed/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: source-mc57-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY || secrets.FRED_API || secrets.FRED_KEY || secrets.FRED }}
      MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore audited source assets
        run: tar -xJf bootstrap/recovery-assets.tar.xz

      - name: Install exact acquisition dependencies
        run: >-
          python -m pip install
          "numpy<3" "pandas<3" "yfinance==0.2.66"
          requests beautifulsoup4 lxml pytest "psycopg[binary]<4"

      - name: Verify FRED secret
        shell: bash
        run: test -n "$FRED_API_KEY"

      - name: Verify Massive secret
        shell: bash
        run: test -n "$MASSIVE_API_KEY"

      - name: Run deterministic provider tests
        run: python -m pytest

      - name: Restore prior successful OHLCV baseline
        uses: actions/cache@v4
        with:
          path: |
            work/ohlcv.csv
            work/massive-reference.json
            work/massive-grouped.json
          key: source-mc57-ohlcv-${{ github.run_id }}
          restore-keys: |
            source-mc57-ohlcv-

      - name: Acquire current session and calculate MC57
        shell: bash
        run: |
          set +e
          python scripts/refresh_mc57.py --repo-root . 2>&1 | tee work/refresh.log
          status="${PIPESTATUS[0]}"
          if test "$status" -ne 0; then
            code="$(grep '^SOURCE_MC57_FAILURE=' work/refresh.log | tail -n 1)"
            test -n "$code" || code="SOURCE_MC57_FAILURE=UNKNOWN"
            code="${code//'%'/'%25'}"
            echo "::error title=source-mc57 acquisition::${code}"
            exit "$status"
          fi

      - name: Preserve failed acquisition cache
        if: failure()
        uses: actions/cache/save@v4
        with:
          path: |
            work/ohlcv.csv
            work/massive-reference.json
            work/massive-grouped.json
          key: source-mc57-ohlcv-${{ github.run_id }}

      - name: Build frozen source page with current data
        run: >-
          python scripts/build_exact_source_mc57_clone.py
          --repo-root . --data-dir data
          --source-dir sources/build_dashboard_4
          --work-dir work --output source-mc57.html

      - name: Add post-September-16 improvements
        shell: bash
        run: |
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          python scripts/enhance_source_mc57.py             --html source-mc57.html --ohlcv work/ohlcv.csv             --chart-dir chart-data --session "$session"

      - name: Publication gates
        run: python scripts/validate_publication.py --root .

      - name: Build and secret-scan deterministic research snapshot
        env:
          SNAPSHOT_DATABASE_URL: ${{ secrets.SNAPSHOT_DATABASE_URL }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
        run: >-
          python scripts/research_snapshot_archive.py
          --repo-root .
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --code-sha "${{ github.sha }}"
          --result-json work/research-snapshot/archive-result.json

      - name: Upload research snapshot to Google Drive
        id: drive
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        shell: bash
        run: |
          python scripts/upload_research_snapshot_drive.py             --archive-result work/research-snapshot/archive-result.json             --result-json work/research-snapshot/drive-result.json
          status="$(python -c 'import json; print(json.load(open("work/research-snapshot/drive-result.json"))["copy_status"])')"
          echo "copy_status=$status" >> "$GITHUB_OUTPUT"

      - name: Record research snapshot manifest in Neon
        id: neon
        env:
          SNAPSHOT_DATABASE_URL: ${{ secrets.SNAPSHOT_DATABASE_URL }}
        shell: bash
        run: |
          python scripts/record_research_snapshot.py             --archive-result work/research-snapshot/archive-result.json             --drive-result work/research-snapshot/drive-result.json             --result-json work/research-snapshot/neon-result.json
          status="$(python -c 'import json; print(json.load(open("work/research-snapshot/neon-result.json"))["record_status"])')"
          echo "record_status=$status" >> "$GITHUB_OUTPUT"

      - name: Write append-only public hash record
        id: hash
        shell: bash
        run: |
          hash_path="$(python scripts/finalize_research_hash_record.py             --archive-result work/research-snapshot/archive-result.json             --drive-result work/research-snapshot/drive-result.json             --neon-result work/research-snapshot/neon-result.json)"
          echo "hash_path=$hash_path" >> "$GITHUB_OUTPUT"

      - name: Save public-safe preservation snapshot
        uses: actions/upload-artifact@v4
        with:
          name: source-mc57-public-preservation-${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: 90
          compression-level: 6
          path: |
            source-mc57.html
            chart-data/
            latest-manifest.json
            ${{ steps.hash.outputs.hash_path }}

      - name: Temporary raw fallback until Drive copy succeeds
        if: steps.drive.outputs.copy_status != 'success'
        uses: actions/upload-artifact@v4
        with:
          name: source-mc57-raw-fallback-${{ github.run_id }}-a${{ github.run_attempt }}
          retention-days: 30
          compression-level: 6
          path: |
            work/research-snapshot/*.tar.gz
            work/research-snapshot/archive-result.json
            work/research-snapshot/drive-result.json
            work/research-snapshot/neon-result.json

      - name: Publish source-only outputs and research hash
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- source-mc57.html chart-data latest-manifest.json research-hashes
          if git diff --cached --quiet; then
            echo "No publication change"
            exit 0
          fi
          session="$(python -c 'import json; print(json.load(open("latest-manifest.json"))["session_date"])')"
          git commit -m "Update source-mc57 through ${session} [skip refresh]"
          git push origin HEAD:main
