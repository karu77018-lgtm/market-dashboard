name: Finalize saved Jev forecasts without repeating holdout
on:
  push:
    branches: [research/jev-forecast-validation-20260929]
    paths: ['tools/finalize_jev_forecast.py', '.github/workflows/finalize-jev-forecast.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: jev-finalize-saved-study
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install pinned dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 scipy==1.15.3 pyarrow==19.0.1 requests==2.32.5 cryptography==46.0.4 pytest==9.0.2
      - name: Recheck numerical invariants without paid calls
        run: python -m pytest research/jev_forecast_complete/test_complete.py -q
      - name: Read identical frozen public inputs
        uses: actions/checkout@v4
        with:
          ref: d84a70dd46df011df502217f2737ed08a1e90fa2
          path: price-source
          sparse-checkout: |
            /chart-data/
            /source-mc57.html
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Read identical frozen market inputs
        uses: actions/checkout@v4
        with:
          ref: 79219a30227046f9651444ab8f7ab7c794a500cd
          path: market-source
          sparse-checkout: research/tqqq_swing/data
          persist-credentials: false
      - name: Restore existing news and price archives
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: python research/jev_forecast_validation/study.py prepare
      - name: Finish missing current forecasts and post-outcome review only
        id: finish
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
          JEV_API_SECRET: ${{ secrets.JEV_API_SECRET }}
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY || secrets.MASSIVE_API || secrets.MASSIVE_KEY || secrets.MASSIVE || secrets.POLYGON_API_KEY || secrets.POLYGON_KEY }}
        run: python tools/finalize_jev_forecast.py
      - name: Preserve all raw research evidence encrypted
        if: always() && steps.restore.outcome == 'success'
        id: seal
        env:
          ARCHIVE_PASSPHRASE: ${{ secrets.ARCHIVE_PASSPHRASE }}
        run: python research/jev_forecast_validation/study.py seal
      - name: Save completed numeric results and encrypted model evidence
        if: always() && steps.seal.outcome == 'success'
        id: archive
        uses: actions/upload-artifact@v4
        with:
          name: jev-forecast-final-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 90
          compression-level: 6
          if-no-files-found: error
          path: |
            forecast-output/*.json
            forecast-output/*.aesgcm
      - name: Read existing private preservation helper
        if: always() && steps.seal.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: d84a70dd46df011df502217f2737ed08a1e90fa2
          path: preservation-source
          sparse-checkout: scripts/phase_a0
          persist-credentials: false
      - name: Save encrypted completed research to private Drive
        if: always() && steps.seal.outcome == 'success'
        id: drive
        continue-on-error: true
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ vars.GOOGLE_DRIVE_FOLDER_ID || secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          python preservation-source/scripts/phase_a0/upload_google_drive.py "forecast-output/jev-forecast-${GITHUB_RUN_ID}.tar.gz.aesgcm" > .private-forecast/drive-receipt.json 2> .private-forecast/drive-error.log || { echo 'DRIVE_COPY_FAILED_ENCRYPTED_ARTIFACT_RETAINED'; exit 1; }
          echo 'Encrypted final research saved to existing private Drive'
      - name: Check completed result and preservation
        if: always()
        env:
          FINISH: ${{ steps.finish.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
          DRIVE: ${{ steps.drive.outcome }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path('forecast-output/completion-report.json')
          r=json.loads(p.read_text()) if p.exists() else {}
          ok=os.environ.get('FINISH')=='success' and os.environ.get('ARCHIVE')=='success' and r.get('status')=='completed'
          print(json.dumps({'status':r.get('status','missing'),'archive':os.environ.get('ARCHIVE'),'drive':os.environ.get('DRIVE'),'finalization':os.environ.get('FINISH'),'complete':ok}))
          raise SystemExit(0 if ok else 2)
          PY
