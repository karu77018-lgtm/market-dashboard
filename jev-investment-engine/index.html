<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jev Investment Engine</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:780px;margin:0 auto;padding:24px;background:#0b0d10;color:#f3f4f6}
    .card{background:#151922;border:1px solid #2a3140;border-radius:16px;padding:18px;margin:14px 0}
    .muted{color:#9ca3af}.ok{color:#86efac}.bad{color:#fca5a5}code{background:#0b0d10;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>Jev Investment Engine</h1>
  <p class="muted">Shadow research layer for market-dashboard.</p>
  <div class="card">
    <strong>Status</strong>
    <pre id="status">loading...</pre>
  </div>
  <div class="card">
    <strong>Phase</strong>
    <p>1. AI Gateway疎通 → 2. DB保存 → 3. Red Flag → 4. Backfill/MCP</p>
  </div>
  <script>
    fetch('/api/health')
      .then(r => r.json())
      .then(data => {
        const cls = data.ok && data.aiGatewayConfigured ? 'ok' : 'bad';
        document.getElementById('status').innerHTML =
          '<span class="' + cls + '">' + JSON.stringify(data, null, 2) + '</span>';
      })
      .catch(err => {
        document.getElementById('status').textContent = String(err);
      });
  </script>
</body>
</html>
